name: display_controller
description: "Display Controller - mirrors selected displays into always-on-top windows."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0-271.0.dev

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.2
  shared_preferences: ^2.5.3
  display_capture_api:
    path: packages/display_capture_api
  display_capture:
    path: packages/display_capture

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
