name: display_capture
description: "Native platform layer (Windows) for the Display Controller: display enumeration and GPU screen capture."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0-271.0.dev
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: DisplayCapturePluginCApi
