name: display_capture
description: "Native display capture and GPU rendering plugin for the Display Controller."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0-271.0.dev
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: DisplayCapturePluginCApi
      macos:
        pluginClass: DisplayCapturePlugin
