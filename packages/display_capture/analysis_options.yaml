# The plugin has no Dart code of its own (native platform layer only). It does not
# depend on flutter_lints, so it must not include it: an unresolved include is an
# analyzer warning and would fail `flutter analyze` (and CI).
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
