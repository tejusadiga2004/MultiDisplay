name: Build macOS

on:
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep this in sync with windows-build.yml and README.md.
  FLUTTER_COMMIT: fab991537bf1ffb063579a0dd8a47cd4f2874618

defaults:
  run:
    shell: bash

jobs:
  build:
    name: macOS (universal, release)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare Xcode and Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcrun --sdk macosx metal --version

      - name: Install Flutter at the pinned commit
        run: |
          set -euo pipefail
          flutter_dir="$RUNNER_TEMP/flutter"
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$flutter_dir"
          git -C "$flutter_dir" checkout --detach "$FLUTTER_COMMIT"
          actual="$(git -C "$flutter_dir" rev-parse HEAD)"
          if [ "$actual" != "$FLUTTER_COMMIT" ]; then
            echo "::error::Flutter is at $actual but $FLUTTER_COMMIT is pinned"
            exit 1
          fi
          echo "$flutter_dir/bin" >> "$GITHUB_PATH"

      - name: Enable Flutter macOS multi-window support
        run: |
          set -euo pipefail
          flutter config --no-analytics --enable-macos-desktop --enable-windowing --enable-swift-package-manager --no-enable-macos-arm64-only
          flutter --version
          if ! flutter doctor -v | grep -E 'Feature flags:.*enable-windowing' > /dev/null; then
            echo "::error::enable-windowing is not active"
            exit 1
          fi

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_COMMIT }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-${{ env.FLUTTER_COMMIT }}-

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (app and API package)
        run: |
          set -euo pipefail
          flutter analyze
          flutter analyze packages/display_capture_api

      - name: Dart tests (app)
        if: ${{ hashFiles('test/**/*_test.dart') != '' }}
        run: flutter test

      - name: Dart tests (API package)
        if: ${{ hashFiles('packages/display_capture_api/test/**/*_test.dart') != '' }}
        working-directory: packages/display_capture_api
        run: flutter test

      - name: Build macOS (release)
        run: flutter build macos --release

      - name: Verify and package
        run: bash tools/installers/macos/package.sh

      - name: Upload installer, portable build and checksums
        uses: actions/upload-artifact@v4
        with:
          name: multi-display-macos-universal
          path: build/installers/macos/*
          if-no-files-found: error
          retention-days: 14
